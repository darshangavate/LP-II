
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Explorer</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            color: #333;
        }

        header, footer {
            background: #17365d;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background: #254b77;
            text-align: center;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        nav a:hover { color: #ffd27d; }

        main {
            width: 85%;
            margin: 25px auto;
        }

        section {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #00000012;
        }

        h2 {
            color: #17365d;
            border-bottom: 2px solid #d59a43;
            padding-bottom: 10px;
        }

        .filters {
            display: flex;
            gap: 12px;
            margin: 20px 0;
        }

        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            flex: 1;
        }

        button {
            background: #17365d;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover { background: #254b77; }

        #result {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .card {
            background: #f3f6fa;
            padding: 18px;
            border: 1px solid #ddd;
            border-radius: 7px;
        }

        .card h3 {
            color: #17365d;
            margin-top: 0;
        }

        .card p { margin: 8px 0; }

        .empty {
            color: red;
            font-weight: bold;
        }

        footer { margin-top: 25px; }
    </style>
</head>

<body>

    <header>
        <h1>IT Department</h1>
        <p>Dynamic Event Explorer</p>
    </header>

    <nav>
        <a href="#events">Explore Events</a>
    </nav>

    <main>
        <section id="events">
            <h2>Explore Events</h2>

            <div class="filters">

                <input type="text" id="search"
                       placeholder="Search events"
                       oninput="showEvents()">

                <select id="category" onchange="showEvents()">
                    <option value="All">All Categories</option>
                    <option value="Technical">Technical</option>
                    <option value="Cultural">Cultural</option>
                    <option value="Sports">Sports</option>
                </select>

                <input type="date" id="date"
                       onchange="showEvents()">

                <select id="sort" onchange="showEvents()">
                    <option value="asc">Oldest First</option>
                    <option value="desc">Newest First</option>
                </select>

                <button onclick="resetFilters()">Reset</button>

            </div>

            <div id="result"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 IT Department</p>
    </footer>

    <script>
        // Event array
        let events = [
            {name:"Hackathon", category:"Technical", date:"2026-12-10"},
            {name:"Dance", category:"Cultural", date:"2026-11-20"},
            {name:"Cricket", category:"Sports", date:"2026-12-05"},
            {name:"Workshop", category:"Technical", date:"2026-11-25"}
        ];

        function showEvents() {

            let s = document.getElementById("search").value.toLowerCase();
            let c = document.getElementById("category").value;
            let d = document.getElementById("date").value;
            let order = document.getElementById("sort").value;

            let output = "";
            let count = 0;

            // Sort by date
            events.sort(function(a, b) {
                if (order == "asc")
                    return a.date.localeCompare(b.date);
                else
                    return b.date.localeCompare(a.date);
            });

            // Search and filter
            for (let i = 0; i < events.length; i++) {

                if (events[i].name.toLowerCase().includes(s) &&
                    (c == "All" || events[i].category == c) &&
                    (d == "" || events[i].date == d)) {

                    output += "<div class='card'>";
                    output += "<h3>" + events[i].name + "</h3>";
                    output += "<p><b>Category:</b> " + events[i].category + "</p>";
                    output += "<p><b>Date:</b> " + events[i].date + "</p>";
                    output += "</div>";

                    count++;
                }
            }

            // Display result
            if (count == 0)
                output = "<p class='empty'>No Results Found</p>";

            document.getElementById("result").innerHTML = output;
        }

        function resetFilters() {
            document.getElementById("search").value = "";
            document.getElementById("category").value = "All";
            document.getElementById("date").value = "";
            document.getElementById("sort").value = "asc";

            showEvents();
        }

        // Display all events initially
        showEvents();
    </script>

</body>
</html>
