
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f6fa;
        color: #333;
    }

    header, footer {
        background: #17365d;
        color: white;
        text-align: center;
        padding: 20px;
    }

    nav {
        background: #254b77;
        text-align: center;
        padding: 12px;
        color: white;
    }

    main {
        width: 80%;
        margin: 25px auto;
    }

    section {
        background: white;
        padding: 25px;
        margin-bottom: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px #00000012;
    }

    h2 {
        color: #17365d;
        border-bottom: 2px solid #d59a43;
        padding-bottom: 10px;
        margin-top: 0;
    }

    input {
        display: block;
        width: 100%;
        padding: 11px;
        margin: 12px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        background: #17365d;
        color: white;
        padding: 11px 18px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin: 5px 5px 5px 0;
    }

    button:hover {
        background: #254b77;
    }

    .event {
        background: #f3f6fa;
        padding: 15px;
        margin: 12px 0;
        border: 1px solid #ddd;
        border-radius: 7px;
    }

    .event h3 {
        color: #17365d;
        margin: 0;
    }

    .event p { color: #555; }

    .delete { background: #c0392b; }
    .delete:hover { background: #922b21; }

    #login { max-width: 450px; margin: auto; }
    #dashboard { display: none; }

    footer { margin-top: 25px; }
</style>
</head>

<body>

<header>
    <h1>IT Department</h1>
    <p>Event Management System</p>
</header>

<nav>Admin Login | Manage Events</nav>

<main>

    <!-- Login Page -->
    <section id="login">
        <h2>Admin Login</h2>

        <input id="user" placeholder="Username">
        <input id="pass" type="password" placeholder="Password">

        <button onclick="login()">Login</button>
    </section>

    <!-- Dashboard -->
    <div id="dashboard">

        <section>
            <h2>Admin Dashboard - Manage Events</h2>

            <input id="name" placeholder="Event Name">
            <input id="date" type="date">
            <input id="category" placeholder="Category">

            <button onclick="addEvent()">Save Event</button>
            <button onclick="logout()">Logout</button>
        </section>

        <section>
            <h2>Event List</h2>
            <div id="list"></div>
        </section>

    </div>

</main>

<footer>
    <p>&copy; 2026 IT Department</p>
</footer>

<script>
    let events = [];
    let edit = -1;

    // Login
    function login() {
        let user = document.getElementById("user").value;
        let pass = document.getElementById("pass").value;

        if (user == "admin" && pass == "1234") {
            document.getElementById("login").style.display = "none";
            document.getElementById("dashboard").style.display = "block";
            displayEvents();
        } else {
            alert("Invalid Login");
        }
    }

    // Add and Update
    function addEvent() {
        let n = document.getElementById("name").value.trim();
        let d = document.getElementById("date").value;
        let c = document.getElementById("category").value.trim();

        if (n == "" || d == "" || c == "") {
            alert("Fill all fields");
            return;
        }

        let event = {
            name: n,
            date: d,
            category: c
        };

        if (edit == -1) {
            events.push(event);
            alert("Event Added");
        } else {
            events[edit] = event;
            edit = -1;
            alert("Event Updated");
        }

        document.getElementById("name").value = "";
        document.getElementById("date").value = "";
        document.getElementById("category").value = "";

        displayEvents();
    }

    // Display Events
    function displayEvents() {
        let list = document.getElementById("list");
        list.innerHTML = "";

        events.forEach((e, i) => {
            let div = document.createElement("div");
            div.className = "event";

            let title = document.createElement("h3");
            title.textContent = e.name;

            let details = document.createElement("p");
            details.textContent = e.date + " - " + e.category;

            let editBtn = document.createElement("button");
            editBtn.textContent = "Edit";
            editBtn.onclick = function() { editEvent(i); };

            let deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";
            deleteBtn.className = "delete";
            deleteBtn.onclick = function() { deleteEvent(i); };

            div.append(title, details, editBtn, deleteBtn);
            list.appendChild(div);
        });
    }

    // Edit Event
    function editEvent(i) {
        document.getElementById("name").value = events[i].name;
        document.getElementById("date").value = events[i].date;
        document.getElementById("category").value = events[i].category;
        edit = i;
    }

    // Delete Event
    function deleteEvent(i) {
        events.splice(i, 1);
        edit = -1;
        displayEvents();
    }

    // Logout
    function logout() {
        document.getElementById("dashboard").style.display = "none";
        document.getElementById("login").style.display = "block";
        edit = -1;
        document.getElementById("name").value = "";
        document.getElementById("date").value = "";
        document.getElementById("category").value = "";
    }
</script>

</body>
</html>
